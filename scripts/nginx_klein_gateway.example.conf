# Example: single node, 8 GPU workers on loopback, one public ip:port/api.
# Workers are started by start_klein_generation_fleet.sh with KLEIN_FLEET_BIND_HOST=127.0.0.1
# and KLEIN_FLEET_BASE_PORT=18765 (ports 18765–18772).
#
# Usage (adjust paths and upstream count):
#   nginx -c /path/to/nginx_klein_gateway.example.conf
#
# ToolGen:
#   export KLEIN_GEN_BASE_URL=http://THIS_NODE_IP:8080/api

worker_processes 1;
events { worker_connections 4096; }

http {
  upstream klein_workers {
    least_conn;
    server 127.0.0.1:18765;
    server 127.0.0.1:18766;
    server 127.0.0.1:18767;
    server 127.0.0.1:18768;
    server 127.0.0.1:18769;
    server 127.0.0.1:18770;
    server 127.0.0.1:18771;
    server 127.0.0.1:18772;
  }

  server {
    listen 8080;
    client_max_body_size 100m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location /api {
      proxy_pass http://klein_workers;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Connection "";
    }

    location /health {
      proxy_pass http://klein_workers/health;
    }

    # Same shape as vLLM `GET /v1/models` — curl-friendly liveness (200 = at least one worker up).
    location /v1/models {
      proxy_pass http://klein_workers;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
    }
  }
}
