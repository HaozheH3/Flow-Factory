# NFT LoRA — FLUX.2 Klein + ToolGen SearchBetter-style judge via Alibaba Frontier (ToolGen ``FrontierModel``).
# Requires: ToolGen checkout; set ``toolgen_phase4_agent_dir`` (or env ``TOOLGEN_PHASE4_AGENT_DIR``) to
# ``.../ToolGen/phase4_agent`` so ``frontier_model.FrontierModel`` can be imported. Frontier auth matches
# ToolGen ``LLMClient`` (``LLM_TOKEN`` / ``FRONTIER_LLM_TOKEN``, ``FRONTIER_LLM_API_URL``, etc.).
# Dataset rows: same as OpenAI variant (``user_prompt``, ``verification_checklist``, ``evaluation_rubric`` on samples).
# Merge metadata: scripts/merge_toolgen_flow_factory_i2i_jsonl.py
launcher: "accelerate"
config_file: config/accelerate_configs/multi_gpu.yaml
num_processes: 8
main_process_port: 29500
mixed_precision: "bf16"

data:
  dataset_dir: "dataset/sharegpt4o_image_mini"
  preprocessing_batch_size: 8
  dataloader_num_workers: 16
  force_reprocess: false
  cache_dir: "~/.cache/flow_factory/datasets"
  max_dataset_size: 1024
  sampler_type: "auto"

model:
  finetune_type: "lora"
  lora_rank: 64
  lora_alpha: 128
  target_modules: "default"
  model_name_or_path: "black-forest-labs/FLUX.2-klein-base-4B"
  model_type: "flux2-klein"
  resume_path: null
  resume_type: null

log:
  run_name: null
  project: "Flow-Factory"
  logging_backend: "wandb"
  save_dir: "saves/"
  save_freq: 20
  save_model_only: true

train:
  trainer_type: "nft"
  advantage_aggregation: "gdpo"
  nft_beta: 0.1
  off_policy: true
  ema_decay_schedule: "piecewise_linear"
  flat_steps: 0
  ramp_rate: 0.001
  ema_decay: 0.5
  ema_update_interval: 1
  ema_device: "cuda"
  num_train_timesteps: 2
  time_sampling_strategy: "discrete"
  time_shift: 3.0
  timestep_range: 0.5
  kl_type: "v-based"
  kl_beta: 0
  ref_param_device: "cuda"
  adv_clip_range: 5.0
  resolution: 384
  condition_image_size: 384
  num_inference_steps: 8
  guidance_scale: 4.0
  per_device_batch_size: 1
  group_size: 16
  global_std: false
  unique_sample_num_per_epoch: 48
  gradient_step_per_epoch: 1
  gradient_accumulation_steps: auto
  learning_rate: 1.0e-4
  adam_weight_decay: 1.0e-4
  adam_betas: [0.9, 0.999]
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  enable_gradient_checkpointing: false
  seed: 42

scheduler:
  dynamics_type: "ODE"

eval:
  resolution: 1024
  condition_image_size: 1024
  per_device_batch_size: 1
  guidance_scale: 4.0
  num_inference_steps: 28
  eval_freq: 20
  seed: 42

rewards:
  - name: "toolgen_searchbetter_judge_frontier"
    reward_model: "toolgen_searchbetter_judge_frontier"
    batch_size: 2
    device: "cuda"
    dtype: bfloat16
    toolgen_phase4_agent_dir: "/primus_xpfs_workspace_T04/haozhe/ToolGen/phase4_agent"
    frontier_model_name: "doubao-seed-2.0-mini"
    max_concurrent: 2
    max_retries: 3
    temperature: 0.2
    max_tokens: 8000
    max_pixels: 589824
    frontier_max_total_pixels: 589824
    variant: "training"
