# NFT LoRA — FLUX.2 Klein (i2i-style conditioning) + ToolGen SearchBetter-style judge (`toolgen_searchbetter_judge`).
# Requires: pip install openai; dataset JSONL rows must include user_prompt, verification_checklist,
# evaluation_rubric (see Sample.extra_kwargs), plus prompt / image / condition image paths for the loader.
# Merge ToolGen metadata into base rows: scripts/merge_toolgen_flow_factory_i2i_jsonl.py
# Point judge HTTP at any OpenAI-compatible multimodal endpoint (same contract as ToolGen phase5 judge).
launcher: "accelerate"
config_file: config/accelerate_configs/multi_gpu.yaml
num_processes: 8
main_process_port: 29500
mixed_precision: "bf16"

data:
  dataset_dir: "dataset/sharegpt4o_image_mini"
  preprocessing_batch_size: 8
  dataloader_num_workers: 16
  force_reprocess: false
  cache_dir: "~/.cache/flow_factory/datasets"
  max_dataset_size: 1024
  sampler_type: "auto"

model:
  finetune_type: "lora"
  lora_rank: 64
  lora_alpha: 128
  target_modules: "default"
  model_name_or_path: "black-forest-labs/FLUX.2-klein-base-4B"
  model_type: "flux2-klein"
  resume_path: null
  resume_type: null

log:
  run_name: null
  project: "Flow-Factory"
  logging_backend: "wandb"
  save_dir: "saves/"
  save_freq: 20
  save_model_only: true

train:
  trainer_type: "nft"
  advantage_aggregation: "gdpo"
  nft_beta: 0.1
  off_policy: true
  ema_decay_schedule: "piecewise_linear"
  flat_steps: 0
  ramp_rate: 0.001
  ema_decay: 0.5
  ema_update_interval: 1
  ema_device: "cuda"
  num_train_timesteps: 2
  time_sampling_strategy: "discrete"
  time_shift: 3.0
  timestep_range: 0.5
  kl_type: "v-based"
  kl_beta: 0
  ref_param_device: "cuda"
  adv_clip_range: 5.0
  resolution: 384
  condition_image_size: 384
  num_inference_steps: 8
  guidance_scale: 4.0
  per_device_batch_size: 1
  group_size: 16
  global_std: false
  unique_sample_num_per_epoch: 48
  gradient_step_per_epoch: 1
  gradient_accumulation_steps: auto
  learning_rate: 1.0e-4
  adam_weight_decay: 1.0e-4
  adam_betas: [0.9, 0.999]
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  enable_gradient_checkpointing: false
  seed: 42

scheduler:
  dynamics_type: "ODE"

eval:
  resolution: 1024
  condition_image_size: 1024
  per_device_batch_size: 1
  guidance_scale: 4.0
  num_inference_steps: 28
  eval_freq: 20
  seed: 42

rewards:
  - name: "toolgen_searchbetter_judge"
    reward_model: "toolgen_searchbetter_judge"
    batch_size: 2
    device: "cuda"
    dtype: bfloat16
    api_base_url: "http://127.0.0.1:8000/v1"
    api_key: "EMPTY"
    vlm_model: "gpt-4o-mini"
    max_concurrent: 4
    max_retries: 3
    timeout: 300.0
    temperature: 0.2
    max_tokens: 8000
    max_pixels: 589824
    variant: "training"
